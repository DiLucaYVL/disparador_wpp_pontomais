version: "3.9"

services:
  app:
    build: .
    container_name: disparador-wpp
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    ports:
      - "192.168.99.50:8000:8000"
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/log
      - task_status_data:/app/task_status
      - ./secrets:/app/secrets:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: disparador-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

volumes:
  uploads_data:
  logs_data:
  task_status_data:
